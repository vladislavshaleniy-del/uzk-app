name: Update live data
on:
  schedule:
    - cron: '23 */2 * * *'   # news every 2 hours; places refresh themselves weekly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-data.mjs', '.github/workflows/update-data.yml']
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Commit data
        run: |
          git config user.name "uzk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: обновление новостей и заведений"
          git pull --rebase origin main
          git push origin HEAD:main
