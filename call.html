<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Позвонить</title>
<style>body{font-family:-apple-system,Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#143E20}a{background:#fff;color:#143E20;font-size:22px;font-weight:700;padding:18px 28px;border-radius:16px;text-decoration:none}</style></head>
<body><a id="c" href="#">📞 Позвонить</a>
<script>var n=(location.hash||'').replace(/[^\d]/g,'');var a=document.getElementById('c');if(n){a.href='tel:+'+n;a.textContent='📞 +'+n;location.href='tel:+'+n;}</script></body></html>
