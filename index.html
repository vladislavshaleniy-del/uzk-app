    const sc = el('div', 'scroller ' + (e.dir === 'HORIZONTAL' ? 'hs' : e.dir === 'VERTICAL' ? 'vs' : 'vs hs'), parent);
    box(sc, e.x, e.y, e.w, e.h + extra);
    const inner = el('div', 'layer', sc); inner.style.width = P(e.cw); inner.style.height = P(e.ch);
    img(inner, 's:' + e.id);
    layers['s:' + e.id] = inner;
  }
  for (const [L, x, y, w, h, to] of S.hs) {
    const parent = layers[L]; if (!parent) continue;
    const b = hot(parent, x, y, w, h, () => to === 'B' ? goBack() : to.startsWith('B>') ? goBack(to.slice(2)) : to.startsWith('a:') ? runAction(to.slice(2)) : to.startsWith('h:') ? go(to.split('?')[0], to.split('?')[1]) : go(to)); b.dataset.to = to;
  }
  for (const l of S.langs) {

  }
  for (const L of ((DATA.live || {})[id] || [])) {
    const parent = layers[L.in]; if (!parent) continue;
    const d = el('div', 'live live-' + L.k, parent); box(d, L.x, L.y, L.w, L.h); d.dataset.k = L.k;
    d.style.fontSize = P(L.fs); d.style.lineHeight = P(L.h);
    if (L.k === 'city') {

      d.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); go('h:city'); });
    } else d.textContent = liveText(L.k);
  }
  if (typeof afterRender === 'function') afterRender(id, layers);
}
setInterval(() => document.querySelectorAll('.live-date, .live-mdate').forEach(e => { e.textContent = liveText(e.dataset.k); }), 15000);

function go(id, p) { if (!DATA.screens[id] && !(id.startsWith('h:') && HS[id.slice(2)])) return; const st = history.state || {}; const d = st.depth || 0; const flowBase = id.startsWith('h:') ? ((current && current.startsWith('h:') && st.flowBase != null) ? st.flowBase : d) : null; history.pushState({ id, p: p == null ? null : p, depth: d + 1, flowBase }, '', '#' + id.replace(':', '-')); render(id, p); }
function goBack(fallback) { if (history.state && history.state.depth > 0) history.back(); else if (fallback && fallback !== current) go(fallback); else if (current !== START) go(START); }
window.addEventListener('popstate', e => render((e.state && e.state.id) || START, e.state && e.state.p));

// Re-layout only when the screen size really changed, keeping scroll positions (no jump to top).
function relayout() {
  window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  const [iw, ih, st] = screenSize();
  if (Math.abs(iw - lastW) < 2 && Math.abs(ih - lastH) < 2 && Math.abs(st - lastS) < 1) return;
  const oldU = U;
  const pos = [...app.querySelectorAll('.root, .scroller')].map(s => [s.scrollLeft, s.scrollTop]);
  layout(); render(current, currentP);
  const k = U / oldU;
  [...app.querySelectorAll('.root, .scroller')].forEach((s, i) => { if (pos[i]) { s.scrollLeft = pos[i][0] * k; s.scrollTop = pos[i][1] * k; } });
}
let rlT = 0;

window.addEventListener('resize', scheduleRelayout);

window.addEventListener('pageshow', () => setTimeout(relayout, 50));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { setTimeout(relayout, 50); setTimeout(relayout, 400); } });
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleRelayout);
// The page itself must never move: block pinch-zoom and rubber-banding outside real scroll areas.
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
  let n = e.target;
  while (n && n !== document.body && n !== document.documentElement) {
    if (n.nodeType === 1 && (n.classList.contains('vs') || n.classList.contains('hs') || n.classList.contains('h-body') || n.classList.contains('ai-scroll') || n.id === 'install')) {
      if (n.scrollHeight > n.clientHeight + 1 || n.scrollWidth > n.clientWidth + 1) return;

}, { passive: false });
window.addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });

layout();
const fromHash = location.hash ? location.hash.slice(1).replace('-', ':') : null;
let authed = false; try { authed = localStorage.getItem('uzk-auth') === '1'; } catch (e) {}
const first = !authed ? 'h:welcome' : (fromHash && DATA.screens[fromHash]) ? fromHash : START;
setLang(LANG);
history.replaceState({ id: first, depth: 0 }, '', location.pathname + location.search + ((first === START || first.startsWith('h:')) ? '' : '#' + first.replace(':', '-')));
render(first);
const splash = document.getElementById('splash');
const firstImg = app.querySelector('img');
const hide = () => { splash.style.opacity = 0; setTimeout(() => splash.remove(), 300); };
if (firstImg && !firstImg.complete) { firstImg.addEventListener('load', hide); firstImg.addEventListener('error', hide); setTimeout(hide, 2500); } else hide();
window.addEventListener('load', () => {
  for (const k in DATA.imgs) { const i = new Image(); i.src = imgSrc(DATA.imgs[k]); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
});

// ---- "Install the app" screen: shown only when opened as a website on a phone ----
(function () {
  const ua = navigator.userAgent || '';
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
  const mobile = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  if (standalone || !mobile) return;
  let skipped = false; try { skipped = sessionStorage.getItem('uzk-skip-install') === '1'; } catch (e) {}
  if (skipped) return;
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  const inApp = /Telegram|FBAN|FBAV|Instagram|WhatsApp|Line\/|VKClient|OKApp|; wv\)|GSA\//i.test(ua);
  const iosOther = ios && /CriOS|FxiOS|EdgiOS|YaBrowser|OPiOS/i.test(ua);
  const box = document.getElementById('install');
  const body = document.getElementById('installBody');
  const SHARE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const PLUS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  const DOTS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const step = (n, html) => `<div class="step"><div class="num">${n}</div><div>${html}</div></div>`;
  let deferred = null;
  function show() {
    let html = '';
    if (deferred) {
      html = `<button class="btn" id="installBtn">Установить приложение</button><div class="note">После установки откройте MyUzCity с иконки на рабочем столе</div>`;
    } else if (ios && !inApp) {
      html = `<div class="steps">` +
        step(1, `Нажмите «Поделиться» ${SHARE} внизу экрана<br><span style="opacity:.75;font-size:14px">(или ⋯ → Поделиться)</span>`) +
        step(2, `Выберите «На экран „Домой“» ${PLUS}`) +
        step(3, `Включите «Открыть как веб‑приложение» и нажмите «Добавить»`) +
        step(4, `Откройте <b>MyUzCity</b> с иконки на рабочем столе`) + `</div>` +
        (iosOther ? `<div class="note">Если пункта «На экран „Домой“» нет — откройте эту ссылку в Safari</div>` : '');

    } else {
      html = `<div class="steps">` +
        step(1, `Откройте меню браузера ${DOTS}`) +

    }

    if (b) b.onclick = async () => {

        if (r && r.outcome === 'accepted') { body.innerHTML = `<div class="steps">${step('✓', 'Готово! Откройте <b>MyUzCity</b> с иконки на рабочем столе')}</div>`; return; }

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });

  show();
})();
