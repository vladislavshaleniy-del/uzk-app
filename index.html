  let skipped = false; try { skipped = sessionStorage.getItem('uzk-skip-install') === '1'; } catch (e) {}
  if (skipped) return;
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  const inApp = /Telegram|FBAN|FBAV|Instagram|WhatsApp|Line\/|VKClient|OKApp|; wv\)|GSA\//i.test(ua);
  const iosOther = ios && /CriOS|FxiOS|EdgiOS|YaBrowser|OPiOS/i.test(ua);
  const box = document.getElementById('install');
  const body = document.getElementById('installBody');
  const SHARE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const PLUS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  const DOTS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const step = (n, html) => `<div class="step"><div class="num">${n}</div><div>${html}</div></div>`;
  let deferred = null;
  function show() {
    let html = '';
    if (deferred) {
      html = `<button class="btn" id="installBtn">Установить приложение</button><div class="note">После установки откройте UZK с иконки на рабочем столе</div>`;
    } else if (ios && !inApp) {
      html = `<div class="steps">` +
        step(1, `Нажмите «Поделиться» ${SHARE} внизу экрана<br><span style="opacity:.75;font-size:14px">(или ⋯ → Поделиться)</span>`) +
        step(2, `Выберите «На экран „Домой“» ${PLUS}`) +
        step(3, `Включите «Открыть как веб‑приложение» и нажмите «Добавить»`) +
        step(4, `Откройте <b>UZK</b> с иконки на рабочем столе`) + `</div>` +
        (iosOther ? `<div class="note">Если пункта «На экран „Домой“» нет — откройте эту ссылку в Safari</div>` : '');
    } else if (inApp) {
      html = `<div class="steps">` +
        step(1, `Нажмите ${DOTS} или ⋯ вверху и выберите «Открыть в ${ios ? 'Safari' : 'браузере'}»`) +
        step(2, `В браузере вы увидите инструкцию по установке`) + `</div>`;
    } else {
      html = `<div class="steps">` +
        step(1, `Откройте меню браузера ${DOTS}`) +
        step(2, `Нажмите «Установить приложение» или «Добавить на главный экран»`) +
        step(3, `Откройте <b>UZK</b> с иконки на рабочем столе`) + `</div>`;
    }
    body.innerHTML = html;
    const b = document.getElementById('installBtn');
    if (b) b.onclick = async () => {
      try { deferred.prompt(); const r = await deferred.userChoice; deferred = null;
        if (r && r.outcome === 'accepted') { body.innerHTML = `<div class="steps">${step('✓', 'Готово! Откройте <b>UZK</b> с иконки на рабочем столе')}</div>`; return; }
      } catch (e) {}
      show();
    };
    box.classList.add('show');
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', () => { body.innerHTML = `<div class="steps">${step('✓', 'Готово! Откройте <b>UZK</b> с иконки на рабочем столе')}</div>`; });
  document.getElementById('installSkip').onclick = () => { try { sessionStorage.setItem('uzk-skip-install', '1'); } catch (e) {} box.classList.remove('show'); };
  show();
})();
</script>
</body>
</html>
