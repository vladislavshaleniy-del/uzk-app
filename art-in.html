<!doctype html>
<meta charset="utf-8">
<title>art hand-off</title>
<body style="font:16px system-ui;background:#04110A;color:#F4F1E8;padding:24px">waiting for the picture…
<script>
// Temporary: receives a generated picture from the Gemini tab and stores it through /api/art.
addEventListener('message', async e => {
  const d = e.data;
  if (e.origin !== 'https://gemini.google.com' || !d || !d.mzArt || !(d.blob instanceof Blob)) return;
  if (window.__busy) return; window.__busy = true;
  let t = '';
  try { const r = await fetch('/api/art?n=' + encodeURIComponent(d.name), { method: 'POST', body: d.blob }); t = r.status + ' ' + await r.text(); }
  catch (err) { t = 'error ' + err.message; }
  document.body.textContent = t;
  e.source.postMessage({ mzAck: t }, e.origin);
});
</script>
